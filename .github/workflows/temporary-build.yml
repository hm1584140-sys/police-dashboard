name: Temporary Build Check

on:
  push:
    branches:
      - feature/sector-management

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: build-check-secret
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check-anon
