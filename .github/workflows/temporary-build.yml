name: Temporary Build Check

on:
  push:
    branches:
      - feature/sector-management
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: build-check-secret
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check-anon
        run: npm run build
